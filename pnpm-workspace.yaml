packages:
  - .
  - examples/*
  - examples/session/*
  - src/*/server/internal/html

strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade

catalog:
  file-type: '22.0.1'
  ox: '0.14.33'
  typescript: '~7.0.2'

overrides:
  mppx: 'workspace:*'
  vitest: 'npm:@voidzero-dev/vite-plus-test@~0.1.24'
  typescript: 'catalog:'
  ox: 'catalog:'
  viem: '2.55.13'
  path-to-regexp@<8.4.0: '8.4.0'
  tar@<=7.5.20: '7.5.21'
  postcss@<=8.5.22: '8.5.23'
  nanoid@<3.3.18: '3.3.18'
  '@modelcontextprotocol/sdk@>=1.10.0 <=1.25.3': '1.26.0'
  '@modelcontextprotocol/server': '2.0.0-alpha.2'
  qs@>=6.7.0 <6.16.0: '6.16.0'
  ip-address@<=10.3.0: '10.3.1'
  readdir-glob@<3.0.0: '3.0.0'
  minimatch@>=5.0.0 <5.1.8: '5.1.8'
  minimatch@>=9.0.0 <9.0.7: '9.0.7'
  rollup@>=4.0.0 <4.59.0: '4.59.0'
  ajv@>=7.0.0-alpha.0 <8.18.0: '8.18.0'
  elysia@<1.4.26: '1.4.26'
  file-type: 'catalog:'
  flatted@<=3.4.1: '>=3.4.2'
  follow-redirects@<=1.15.11: '1.16.0'
  fast-uri@<3.1.6: '3.1.6'
  hono@<4.12.34: '4.12.34'
  '@hono/node-server@<2.0.10': '2.0.10'
  undici@>=7.0.0 <7.28.0: '7.28.0'
  undici@>=8.0.0 <8.9.0: '8.9.0'
  socket.io-parser@>=4.0.0 <4.2.7: '4.2.7'
  yaml@<2.8.3: '>=2.8.3'
  brace-expansion@>=5.0.0 <5.0.9: '5.0.9'
  ws@>=8.0.0 <8.21.0: '8.21.0'
  lodash@<=4.17.23: '>=4.18.0'
  protobufjs@<=7.6.4: '7.6.5'
  uuid@<14.0.0: '14.0.0'
  tmp@>=0.2.6 <0.2.7: '0.2.7'
  vite@>=8.0.0 <=8.0.15: '8.0.16'
  vite-plus@<=0.1.23: '0.1.24'
  '@voidzero-dev/vite-plus-test@<=0.1.23': '0.1.24'
  esbuild@>=0.17.0 <0.28.1: '0.28.1'
  read-yaml-file@^1.1.0: '2.1.0'
  js-yaml@>=4.0.0 <4.3.1: '4.3.1'
  body-parser@>=2.0.0 <2.3.0: '2.3.0'

nodeOptions: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

allowBuilds:
  bufferutil: true
  bun: true
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
  utf-8-validate: true

minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - body-parser@2.3.0
  - brace-expansion@5.0.9
  - fast-uri@3.1.6
  - hono@4.12.34
  - ip-address@10.3.1
  - js-yaml@4.3.1
  - nanoid@3.3.18
  - ox@0.14.33
  - postcss@8.5.23
  - protobufjs@7.6.5
  - qs@6.16.0
  - tar@7.5.21
  - tmp@0.2.7
  - socket.io-parser@4.2.7
  - undici@8.9.0
  - viem@2.55.13
  - vite@8.0.16
  - vite-plus@0.1.24
  - ws@8.21.0
