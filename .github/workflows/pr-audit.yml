name: Pull request audit

permissions: {}

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened, ready_for_review]
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to audit
        required: true
        type: number
      sha:
        description: Optional commit SHA override for the audit target
        required: false
        type: string

jobs:
  pr-audit:
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      id-token: write
    uses: tempoxyz/gh-actions/.github/workflows/pr-audit.yml@252d87d9636b94551796b4b8a5cb4e27b8916cf6 # 2026-10-12T22-06-06Z-252d87d9
    with:
      required-label: cyclops
      audit-on-push: true
      audit-on-command: true
    secrets:
      EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
      EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
      EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}

  pr-audit-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (
        startsWith(github.event.comment.body, 'cyclops audit') ||
        startsWith(github.event.comment.body, 'cyclops private audit') ||
        startsWith(github.event.comment.body, '@decofe cyclops audit') ||
        startsWith(github.event.comment.body, '@decofe cyclops private audit') ||
        startsWith(github.event.comment.body, 'derek audit')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@252d87d9636b94551796b4b8a5cb4e27b8916cf6 # 2026-10-12T22-06-06Z-252d87d9

      - name: Handle audit command
        uses: tempoxyz/gh-actions/actions/pr-audit-comment@252d87d9636b94551796b4b8a5cb4e27b8916cf6 # 2026-10-12T22-06-06Z-252d87d9
        with:
          command-regex: '^(?:@decofe\s+)?(?:cyclops\s+(?:private\s+)?audit|derek\s+audit)\b'
          permission-check-mode: association
          allowed-associations: OWNER,MEMBER
          organization: wevm
          events-key: ${{ secrets.EVENTS_KEY }}
          events-cert: ${{ secrets.EVENTS_CERT }}
          events-args: ${{ secrets.EVENTS_ARGS }}
          github-token: ${{ github.token }}

  # Manual audits keep their optional SHA override.
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Resolve manual target SHA
        if: github.event_name == 'workflow_dispatch'
        id: resolve_manual_target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_SHA" ]]; then
            echo "sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"
          else
            SHA=$(gh api "repos/${{ github.repository }}/pulls/$INPUT_PR_NUMBER" --jq '.head.sha')
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish event
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_SHA: ${{ github.event.pull_request.head.sha || steps.resolve_manual_target.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
          EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
        run: |
          set -euo pipefail

          printf '%s' "$EVENTS_KEY" > "$RUNNER_TEMP/key"
          printf '%s' "$EVENTS_CERT" > "$RUNNER_TEMP/cert"

          payload="$(jq -n \
            --arg repository "$REPOSITORY" \
            --arg sha "$PR_SHA" \
            --argjson pr_number "$PR_NUMBER" \
            '{repository:$repository,event:"pr_audit",data:{pr_number:$pr_number,sha:$sha}}')"

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST ${{ secrets.EVENTS_ARGS }} \
            -H "Content-Type: application/json" \
            --key "$RUNNER_TEMP/key" \
            --cert "$RUNNER_TEMP/cert" \
            --data-binary "$payload")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Event publish failed with HTTP $HTTP_CODE"
            exit 1
          fi
