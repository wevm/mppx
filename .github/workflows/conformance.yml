name: Conformance

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
      - labeled
      - unlabeled
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  conformance-policy:
    name: Conformance Policy
    # The reusable jobs start with secure-runner, which needs an OIDC token.
    # Without id-token here GitHub refuses to start the run (startup_failure).
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    uses: tempoxyz/mpp-tools/.github/workflows/sdk-conformance-policy.yml@280f74c141024ca1e1578758a43bba9e96eb86ad # zizmor: ignore[ref-version-mismatch] mpp-tools publishes no tags for these pins.
    with:
      protocol-paths: |
        src/**
        package.json
        pnpm-lock.yaml

  conformance:
    name: Conformance
    needs: conformance-policy
    permissions:
      contents: read
      id-token: write
    uses: tempoxyz/mpp-tools/.github/workflows/sdk-conformance.yml@280f74c141024ca1e1578758a43bba9e96eb86ad # zizmor: ignore[ref-version-mismatch] mpp-tools publishes no tags for these pins.
    with:
      adapter: typescript
      conformance-ref: ${{ needs.conformance-policy.outputs.conformance_ref }}
