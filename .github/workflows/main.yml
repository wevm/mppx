name: Main
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/verify.yml
    secrets:
      VITE_STRIPE_SECRET_KEY: ${{ secrets.VITE_STRIPE_SECRET_KEY }}
      VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}

  changesets:
    name: Changesets
    if: github.repository == 'wevm/mppx'
    needs: verify
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.has-changesets }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e080a269a3d37e571ad64e94f72536b48eb9921c # main

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build
        run: pnpm build

      - name: PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          publish-script: pnpm run changeset:publish
          version-script: pnpm run changeset:version

  snapshot:
    name: Snapshot
    if: github.repository == 'wevm/mppx' && needs.changesets.outputs.hasChangesets == 'true'
    needs: [verify, changesets]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e080a269a3d37e571ad64e94f72536b48eb9921c # main

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Publish main snapshot
        run: |
          pnpm changeset version --snapshot main
          pnpm build
          pnpm changeset:publish:main
