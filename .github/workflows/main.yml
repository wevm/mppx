name: Main
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    secrets:
      VITE_STRIPE_SECRET_KEY: ${{ secrets.VITE_STRIPE_SECRET_KEY }}
      VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}

  # With pending changesets, the changesets action only opens or updates the
  # version PR and never publishes, so this starts right away instead of
  # waiting on verify. It has no publish script, so it cannot publish.
  version-pr:
    name: Version PR
    if: github.repository == 'wevm/mppx'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for pending changesets
        id: pending
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.pending.outputs.has-changesets == 'true'
        uses: ./.github/actions/install-dependencies

      - name: Open or update version PR
        if: steps.pending.outputs.has-changesets == 'true'
        uses: wevm/actions/vendor/changesets/action/abitype@8963daf30237417f873c8e2f17e3bf9415e3a7b9
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          version-script: pnpm run changeset:version

  # Publishes once the version PR is merged (no pending changesets). Gated on
  # verify; skips itself while changesets are pending.
  changesets:
    name: Changesets
    if: github.repository == 'wevm/mppx'
    needs: verify
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for pending changesets
        id: pending
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.pending.outputs.has-changesets != 'true'
        uses: ./.github/actions/install-dependencies

      - name: Build
        if: steps.pending.outputs.has-changesets != 'true'
        run: pnpm build

      - name: Publish
        if: steps.pending.outputs.has-changesets != 'true'
        uses: wevm/actions/vendor/changesets/action/abitype@8963daf30237417f873c8e2f17e3bf9415e3a7b9
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          publish-script: pnpm run changeset:publish
          version-script: pnpm run changeset:version

  # Runs alongside the changesets job: both only need verify, and snapshot
  # checks for pending changesets itself.
  snapshot:
    name: Snapshot
    if: github.repository == 'wevm/mppx'
    needs: verify
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for pending changesets
        id: pending
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.pending.outputs.has-changesets == 'true'
        uses: ./.github/actions/install-dependencies

      - name: Publish main snapshot
        if: steps.pending.outputs.has-changesets == 'true'
        run: |
          pnpm changeset version --snapshot main
          pnpm build
          pnpm changeset:publish:main
