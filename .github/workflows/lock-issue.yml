name: Lock Issue
permissions:
  issues: write

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  lock-issue:
    if: ${{ github.repository_owner == 'wevm' }}
    uses: wevm/actions/.github/workflows/lock-issue-v5.yml@73e899a58d51092d694fbaf94b7a1d8c09bfea28
    with:
      issue-comment: |
        This issue has been locked since it has been closed for more than 14 days.

        If you found a concrete bug or regression related to it, please open a new [bug report](https://github.com/wevm/mppx/issues/new?template=bug_report.yml) with a reproduction against the latest mppx version. If you have any questions or comments you can create a new [discussion thread](https://github.com/wevm/mppx/discussions).
