name: Scan GitHub Actions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Scan GitHub Actions
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      # Scorecard's analysis job can't start with secure-runner: publish_results only accepts
      # an allowlist of actions (checkout, harden-runner, upload-artifact, upload-sarif), so the
      # check reports it without failing. Every other job starts with secure-runner.
      secure-runner-fail-on-violation: false
